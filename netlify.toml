[build]
  command = "npm run build"
  publish = "site"
[dev]
  publish = "site"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/mcp/v1"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/oauth/*"
  to = "/.netlify/functions/oauth-:splat"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/oauth-metadata"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth-resource"
  status = 200
