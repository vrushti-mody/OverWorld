# Fictional demonstration only. All goals, statuses and checks below are invented.
id: demo-signal-garden
name: Signal Garden
domain: systems
mode: campaign
goal: Build an imaginary garden exhibit that turns simulated sensor readings into light.
done_when: A visitor can choose a simulated reading and see its matching light pattern.
note: Fictional project for exploring the interface; no real work or verification is represented.
nodes:
