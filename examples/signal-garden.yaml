      - id: palette
        name: Choose palette
        status: done
        done_when: Three patterns are visually distinguishable.
        check: manual
        note: Fictional verified state for this demo.
      - id: preview
        name: Pattern preview
        status: partial
        needs: [palette]
        done_when: A preview displays the selected pattern.
        steps:
          - {name: Draw one pattern, done: true}
          - {name: Switch between patterns, done: false}
  - id: visitor-controls
    name: Visitor controls
    status: planned
    needs: [light-patterns]
    done_when: A visitor can select and replay each simulated reading.
  - id: exhibit-copy
    name: Exhibit copy
    status: waiting
    done_when: The exhibit has a short instruction card.
    note: Fictional wait for a draft from the imaginary exhibit team; resume when it arrives.
